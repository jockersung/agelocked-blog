general: >-
  Flat editorial health illustration, clean vector lines, soft shadows,
  warm off-white background #FAF7F2, deep teal #1F5C5C and teal #2E8B8B,
  sage #8FB9A8 and amber #E0A43A accents. Orange-red #E8613C only for warnings.
  Landscape, subject within central 85% width and 80% height, generous margins.
  No text, letters, numbers, logos, dark backgrounds, photography, 3D or exaggerated faces.
  Follow the supplied subject without adding diagnoses or treatment claims.
redraw: >-
  The FIRST reference is the original diagram. Preserve its scientific meaning,
  element count, composition and relative positions. The remaining references
  specify style. Remove all original text, replace labels with empty rounded boxes.
product: >-
  Generate ONLY a warm off-white editorial background and a low circular pedestal.
  Leave the right 40 percent empty for a separately composited official product photo.
  Do not render any bottle, package, label, brand, text or medical efficacy claim.
  Botanical decoration and simple line icons may appear outside the product area.
