# 文章語音版：用 Gemini TTS（作者本人複製聲音）產生 MP3，放進 public/audio/ 後自動提交，Cloudflare Pages 會跟著重新部署。
# 唯一要設定的東西：GitHub → Settings → Secrets and variables → Actions → New repository secret
#   名稱 GEMINI_API_KEY，值貼上 Google AI Studio 的 API 金鑰（要和「AGELOCKED本人聲音」在同一個專案）
#
# 什麼時候會跑：
#   - audio-queue.txt 有寫 slug（或 all）並推上 main
#   - 已經有語音的文章被修改並推上 main（只重錄有變的那幾篇）
#   - 在 Actions 頁手動按 Run workflow
name: 文章語音版

on:
  push:
    branches: [main]
    paths:
      - 'src/content/blog/**'
      - 'audio-queue.txt'
      - 'scripts/audio/**'
      - '.github/workflows/article-audio.yml'
  workflow_dispatch:
    inputs:
      slugs:
        description: '要產生語音的文章 slug（空白分隔）；填 all 代表全部'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: article-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          # 一律用最新的 main（前一次排隊的語音提交才看得到）
          ref: main
          fetch-depth: 50

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安裝 ffmpeg
        # 用 ffmpeg-static 下載現成執行檔，比 apt-get 快很多
        run: |
          npm i --prefix /tmp/ff --no-audit --no-fund ffmpeg-static@5.2.0
          echo "FFMPEG=$(node -p "require('/tmp/ff/node_modules/ffmpeg-static')")" >> "$GITHUB_ENV"

      - name: 產生語音並分批提交
        # 每 6 篇提交一次：中途失敗也不會白做，網站會邊做邊上線
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VOICE_ID: ${{ secrets.GEMINI_VOICE_ID }}
          BEFORE: ${{ github.event.before }}
          INPUT_SLUGS: ${{ github.event.inputs.slugs }}
        run: |
          git config user.name "agelocked-audio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for round in $(seq 1 25); do
            node scripts/audio/build-audio.mjs --ci --limit 6 || true
            git add public/audio src/data/audio-manifest.json audio-queue.txt
            if ! git diff --cached --quiet; then
              n=$(git diff --cached --name-only -- public/audio | grep -c '\.mp3$' || true)
              git commit -q -m "語音版：更新 ${n} 篇文章音檔"
              ok=0; for i in 1 2 3; do git pull --rebase -X theirs -q origin main && git push -q && ok=1 && break; sleep 5; done
              [ "$ok" = 1 ] || exit 1
            fi
            # 佇列清空（只剩註解）就結束；只帶入一次 BEFORE/INPUT，避免重複處理
            export BEFORE= INPUT_SLUGS=
            grep -qvE '^\s*(#|$)' audio-queue.txt || break
          done
