<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" rx="24" fill="#FAF7F2"/><g fill="#1F5C5C" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="64" y="102" font-size="46" font-weight="700">LDL 看起來還好，為什麼醫師還會看 ApoB？</text><g transform="translate(64,255)"><rect width="342" height="245" rx="24" fill="#E5F0EB"/><circle cx="46" cy="51" r="21" fill="#2E8B8B"/><path d="M35 51h22M46 40v22" stroke="#FAF7F2" stroke-width="3"/><text x="24" y="122" font-size="29" font-weight="700">LDL-C</text><text x="24" y="173" font-size="23">膽固醇的總量</text></g><g transform="translate(429,255)"><rect width="342" height="245" rx="24" fill="#F5EACD"/><circle cx="46" cy="51" r="21" fill="#2E8B8B"/><path d="M35 51h22M46 40v22" stroke="#FAF7F2" stroke-width="3"/><text x="24" y="122" font-size="29" font-weight="700">ApoB</text><text x="24" y="173" font-size="23">顆粒數量的線索</text></g><g transform="translate(794,255)"><rect width="342" height="245" rx="24" fill="#E5F0EB"/><circle cx="46" cy="51" r="21" fill="#2E8B8B"/><path d="M35 51h22M46 40v22" stroke="#FAF7F2" stroke-width="3"/><text x="24" y="122" font-size="29" font-weight="700">是否有額外用途？</text><text x="24" y="173" font-size="23">依整體風險判斷</text></g><text x="64" y="568" font-size="23">看懂用途，保留脈絡，再決定下一步</text></g><path d="M64 598h1072" stroke="#8FB9A8" stroke-width="3"/></svg>