<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" rx="24" fill="#FAF7F2"/><g fill="#1F5C5C" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="64" y="102" font-size="46" font-weight="700">家人年輕就心肌梗塞？</text><text x="64" y="167" font-size="46" font-weight="700">認識 Lp(a) 這條遺傳風險線索</text><g transform="translate(64,255)"><rect width="342" height="245" rx="24" fill="#E5F0EB"/><circle cx="46" cy="51" r="21" fill="#2E8B8B"/><path d="M35 51h22M46 40v22" stroke="#FAF7F2" stroke-width="3"/><text x="24" y="122" font-size="29" font-weight="700">家族史</text><text x="24" y="173" font-size="23">記下發病年齡</text></g><g transform="translate(429,255)"><rect width="342" height="245" rx="24" fill="#F5EACD"/><circle cx="46" cy="51" r="21" fill="#2E8B8B"/><path d="M35 51h22M46 40v22" stroke="#FAF7F2" stroke-width="3"/><text x="24" y="122" font-size="29" font-weight="700">Lp(a)</text><text x="24" y="173" font-size="23">成人至少量一次</text></g><g transform="translate(794,255)"><rect width="342" height="245" rx="24" fill="#E5F0EB"/><circle cx="46" cy="51" r="21" fill="#2E8B8B"/><path d="M35 51h22M46 40v22" stroke="#FAF7F2" stroke-width="3"/><text x="24" y="122" font-size="29" font-weight="700">整體風險</text><text x="24" y="173" font-size="23">和醫師討論下一步</text></g><text x="64" y="568" font-size="23">看懂用途，保留脈絡，再決定下一步</text></g><path d="M64 598h1072" stroke="#8FB9A8" stroke-width="3"/></svg>