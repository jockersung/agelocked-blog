<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" rx="24" fill="#FAF7F2"/><g fill="#1F5C5C" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="64" y="102" font-size="46" font-weight="700">CRP 正常，還需要看 hs-CRP 嗎？</text><text x="64" y="167" font-size="46" font-weight="700">先看單位，再讀數字</text><g transform="translate(64,255)"><rect width="342" height="245" rx="24" fill="#E5F0EB"/><circle cx="46" cy="51" r="21" fill="#2E8B8B"/><path d="M35 51h22M46 40v22" stroke="#FAF7F2" stroke-width="3"/><text x="24" y="122" font-size="29" font-weight="700">檢驗方法</text><text x="24" y="173" font-size="23">CRP ／ hs-CRP</text></g><g transform="translate(429,255)"><rect width="342" height="245" rx="24" fill="#F5EACD"/><circle cx="46" cy="51" r="21" fill="#2E8B8B"/><path d="M35 51h22M46 40v22" stroke="#FAF7F2" stroke-width="3"/><text x="24" y="122" font-size="29" font-weight="700">先確認單位</text><text x="24" y="173" font-size="23">mg/L ／ mg/dL</text></g><g transform="translate(794,255)"><rect width="342" height="245" rx="24" fill="#E5F0EB"/><circle cx="46" cy="51" r="21" fill="#2E8B8B"/><path d="M35 51h22M46 40v22" stroke="#FAF7F2" stroke-width="3"/><text x="24" y="122" font-size="29" font-weight="700">抽血時的狀況</text><text x="24" y="173" font-size="23">結果需要脈絡</text></g><text x="64" y="568" font-size="23">看懂用途，保留脈絡，再決定下一步</text></g><path d="M64 598h1072" stroke="#8FB9A8" stroke-width="3"/></svg>